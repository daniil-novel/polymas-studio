[package]
name = "polymas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
sha2.workspace = true
toml = "0.9"
regex = "1"
cap-std = "4.0.3"
url = "2"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "server", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "json", "stream"] }
keyring = "4.2.0"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
