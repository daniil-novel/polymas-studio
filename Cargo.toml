[workspace]
members = ["crates/polymas-core", "crates/polymas-daemon", "crates/polymas-desktop-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
tempfile = "3"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
